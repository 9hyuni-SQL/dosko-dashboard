<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>(주)도스코 통합 관제 · 시스템 로그인</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    body {
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #e2e8f0;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .brand .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
    }
    .brand .title {
      font-size: 19px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 15px;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
    }
    .field input:focus, .field input.active-input {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.15s, transform 0.05s;
    }
    .btn:hover { opacity: 0.95; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .alert {
      display: none;
      background: rgba(127, 29, 29, 0.5);
      border: 1px solid #ef4444;
      color: #fecaca;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 16px;
      white-space: pre-line;
      word-break: break-all;
    }
    .alert-warn {
      background: rgba(120, 53, 15, 0.55);
      border: 1px solid #f59e0b;
      color: #fef3c7;
    }
    .alert-success {
      display: none;
      background: rgba(6, 78, 59, 0.45);
      border: 1px solid #10b981;
      color: #a7f3d0;
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 16px;
      white-space: pre-line;
    }
    
    /* 가상 텐키패드 (Virtual Tenkey) */
    .tenkey-container {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
    }
    .tenkey-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
    }
    .tenkey-header .toggle-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }
    .tenkey-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tkey {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      font-size: 20px;
      font-weight: 800;
      padding: 13px 0;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background 0.1s, transform 0.05s;
    }
    .tkey:hover { background: #334155; }
    .tkey:active {
      background: #475569;
      transform: scale(0.96);
    }
    .tkey-action {
      font-size: 13px;
      font-weight: 700;
      background: #182234;
      color: #94a3b8;
    }
    .tkey-back {
      background: #7f1d1d;
      color: #fca5a5;
      border-color: #991b1b;
      font-size: 18px;
    }

    .policy-box {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e293b;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .policy-box strong { color: #38bdf8; }
    .policy-box .highlight { color: #34d399; font-weight: 700; }
    .policy-box .warn { color: #f87171; font-weight: 700; }
    .policy-box code {
      background: #1e293b;
      color: #38bdf8;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
    }
    .links {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #64748b;
    }
    .links a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="dot"></div>
      <div class="title">(주)도스코 통합 관제 · 로그인</div>
    </div>
    <p class="subtitle">
      부여받은 <strong>ID(4자리)</strong>와 초기 비밀번호로 로그인하세요.<br>
      초기 비밀번호는 <strong>4자리</strong>입니다.
    </p>

    <div id="errBox" class="alert"></div>
    <div id="okBox" class="alert-success"></div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="empNo">
          <span>ID</span>
          <span style="font-size:11px; color:#64748b; font-weight:normal;">4자리</span>
        </label>
        <input id="empNo" name="emp_no" type="text" inputmode="numeric" placeholder="ID (4자리)" maxlength="10" required autofocus>
      </div>
      <div class="field">
        <label for="password">
          <span>비밀번호</span>
          <span id="activeFieldIndicator" style="font-size:11px; color:#38bdf8; font-weight:normal;">입력 대기</span>
        </label>
        <input id="password" name="password" type="password" placeholder="비밀번호 (4자리 이상)" maxlength="32" required>
      </div>
      <button id="submitBtn" class="btn" type="submit">로그인</button>
    </form>

    <!-- 현장 태블릿 및 터치스크린 전용 가상 텐키패드 -->
    <div class="tenkey-container" id="tenkeySection">
      <div class="tenkey-header">
        <span id="tenkeyTargetLabel">🔢 가상 숫자 키패드 (입력창 터치)</span>
        <button type="button" class="toggle-btn" onclick="toggleShuffleTenkey()">숫자 배열 섞기</button>
      </div>
      <div class="tenkey-grid" id="tenkeyGrid">
        <!-- Rendered by JS -->
      </div>
    </div>

    <div class="policy-box">
      <strong>🔐 비밀번호 정책 및 보안 가드레일</strong><br>
      • <span class="highlight">초기 비밀번호</span>: <code>4자리</code> (로그인 후 즉시 본인 비밀번호 변경 필수)<br>
      • <span class="warn">오류 통제</span>: <strong>4회 오류 시 경고</strong> 발령, <strong>6회 오류 시 즉시 계정 잠금</strong><br>
      • <strong>잠금 해제</strong>: 전산실에 요청 시 즉시 복구 가능 (본인 확인 후 재설정)
    </div>

    <div class="links">
      <span>DOSKO_ERP Security v2.3</span>
      <a href="/portal">외주 협력사 포털 이동 →</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const nextUrl = params.get("next") || "";

    function safeRedirect(target) {
      if (target && target.startsWith("/") && !target.startsWith("//") && !target.startsWith("/login")) {
        return target;
      }
      return null;
    }

    // 이미 유효 세션 보유 시 자동 이동
    fetch("/api/auth/me", { credentials: "include", cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && data.authenticated && data.user) {
          if (data.user.must_change_pw) {
            window.location.replace("/change-password");
            return;
          }
          const custom = data.user.role_code === "PROD_OP" ? "/easy" : (safeRedirect(nextUrl) || data.user.default_home || "/");
          window.location.replace(custom);
        }
      }).catch(() => {});

    // --- 가상 텐키패드 관리 ---
    const empInput = document.getElementById("empNo");
    const pwInput = document.getElementById("password");
    const indicator = document.getElementById("activeFieldIndicator");
    const tenkeyLabel = document.getElementById("tenkeyTargetLabel");
    let activeInput = empInput;

    function setActiveInput(target) {
      activeInput = target;
      empInput.classList.toggle("active-input", activeInput === empInput);
      pwInput.classList.toggle("active-input", activeInput === pwInput);
      if (activeInput === empInput) {
        indicator.textContent = "ID 입력 중";
        tenkeyLabel.textContent = "🔢 가상 키패드 → [ID]";
      } else {
        indicator.textContent = "비밀번호 입력 중";
        tenkeyLabel.textContent = "🔢 가상 키패드 → [비밀번호]";
      }
    }

    empInput.addEventListener("focus", () => setActiveInput(empInput));
    pwInput.addEventListener("focus", () => setActiveInput(pwInput));
    setActiveInput(empInput);

    let isShuffled = false;
    function renderTenkey(shuffle = false) {
      let nums = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0];
      if (shuffle) {
        nums.sort(() => Math.random() - 0.5);
      }
      const grid = document.getElementById("tenkeyGrid");
      grid.innerHTML = nums.slice(0, 9).map(n => 
        `<button type="button" class="tkey" onclick="appendKey('${n}')">${n}</button>`
      ).join('') + 
      `<button type="button" class="tkey tkey-action" onclick="clearActiveInput()">전체삭제</button>` +
      `<button type="button" class="tkey" onclick="appendKey('${nums[9]}')">${nums[9]}</button>` +
      `<button type="button" class="tkey tkey-back" onclick="backspaceKey()">⌫</button>`;
    }

    function toggleShuffleTenkey() {
      isShuffled = !isShuffled;
      renderTenkey(isShuffled);
    }

    function appendKey(val) {
      if (!activeInput) activeInput = empInput;
      activeInput.value += val;
      activeInput.dispatchEvent(new Event("input", { bubbles: true }));
      // ID 4자리 채워지면 자동으로 비밀번호 칸으로 포커스 전환
      if (activeInput === empInput && empInput.value.length >= 4) {
        setActiveInput(pwInput);
        pwInput.focus();
      }
    }

    function backspaceKey() {
      if (!activeInput) return;
      activeInput.value = activeInput.value.slice(0, -1);
      activeInput.dispatchEvent(new Event("input", { bubbles: true }));
    }

    function clearActiveInput() {
      if (!activeInput) return;
      activeInput.value = "";
      activeInput.dispatchEvent(new Event("input", { bubbles: true }));
    }

    renderTenkey(false);

    // --- 로그인 처리 (XSS 및 Brute Force 방어 처리) ---
    const errBox = document.getElementById("errBox");
    const okBox = document.getElementById("okBox");
    const btn = document.getElementById("submitBtn");

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.style.display = "none";
      errBox.classList.remove("alert-warn");
      okBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "인증 확인 중...";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            emp_no: empInput.value.trim(),
            password: pwInput.value
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.status !== "ok") {
          const msg = data.message || data.error || "로그인에 실패했습니다.";
          errBox.textContent = msg;
          if (msg.includes("경고") || msg.includes("⚠️") || msg.includes("4회")) {
            errBox.classList.add("alert-warn");
          }
          errBox.style.display = "block";
          return;
        }
        if (data.csrf_token) {
          try { sessionStorage.setItem("dosko_csrf_token", data.csrf_token); } catch (_) {}
        }
        if (data.user && data.user.must_change_pw) {
          window.location.replace("/change-password");
          return;
        }
        const u = data.user || {};
        const dest = (u.role_code === "PROD_OP") ? "/easy" : (safeRedirect(nextUrl) || u.default_home || "/");
        window.location.replace(dest);
      } catch (err) {
        errBox.textContent = "통신 오류: " + err.message;
        errBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "로그인";
      }
    });
  </script>
</body>
</html>
